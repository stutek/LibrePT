# OWASP ZAP baseline rule config for LibrePT — consumed by `zap-baseline.py -c` in `build check`.
#
# Policy (AGENT_RULES §2.A.3, "squeaky clean"): every ZAP alert is either FIXED at its source
# (security headers served by deploy/local_http_server.py) or IGNOREd here with a written reason.
# Nothing is left to merely WARN — a warning would fail the build. Only alerts that are genuinely
# not applicable to an offline-first, buildless, static PWA (no backend, no build step, no auth)
# are ignored below. Format: <pluginId><TAB><IGNORE|WARN|FAIL><TAB># reason
#
10027	IGNORE	# Information Disclosure - Suspicious Comments: passive heuristic matching ordinary words (select/user/TODO) in our own open-source, shipped JS comments; no secrets are disclosed.
10031	IGNORE	# User Controllable HTML Element Attribute: "feedback-tag" is only ever a static input name= attribute; the app never reads ?feedback-tag from the URL, so nothing is reflected — false positive.
10049	IGNORE	# Non-Storable Content: cache-storability of the local dev server's 302/404/manifest responses; production caching is the static host's concern, and this is not a security weakness.
10055	IGNORE	# CSP unsafe-inline: this suppresses ONLY the style-src 'unsafe-inline' case — the app is a buildless PWA that sets dynamic inline styles (signal tinting, computed layout) with no build step to hash/extract them, and all interpolated content is escapeHTML'd. NOTE: script-src was independently hardened to 'self' (no unsafe-inline) in index.html/the dev-server CSP header, not via this ignore. RE-CHECK: still holds as of 2026-08-02 (14+ files under src/ still set dynamic inline style="); re-verify if/when that inline-style usage is retired.
10109	IGNORE	# Modern Web Application: informational notice that this is a SPA, not a vulnerability.
10202	IGNORE	# Absence of Anti-CSRF Tokens: there is no server-side, state-changing form — data lives in localStorage on a local-only static app, so CSRF tokens are not applicable. RE-CHECK: still holds as of 2026-08-02 (no OAuth/token code exists yet); re-verify once the planned Google Calendar/Drive OAuth integration (TODO.md §1.5) ships, since OAuth flows commonly need CSRF/state-param protection.
# 90003 (Sub Resource Integrity Missing) was REMOVED 2026-08-05: its whole justification was the
# external Font Awesome stylesheet on cdnjs, and that is now vendored (TODO §12.6). No cross-origin
# subresource remains, so the rule has nothing to flag — and every same-origin asset is covered by
# the service worker's SHA-256 integrity catalog, which is stronger than SRI. If this ever fires
# again it means a new external subresource appeared: fix that, do not re-add the ignore.
90004	IGNORE	# Cross-Origin-Embedder-Policy: cross-origin isolation (SharedArrayBuffer, high-res timers) is not used anywhere in the app, so COEP buys nothing. RE-CHECK 2026-08-05: the old "would block the external CDN fonts/icons" half of this rationale is retired — there are no cross-origin subresources left — but the no-benefit half stands on its own.
