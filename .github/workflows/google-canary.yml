name: Live Google API Canary

# Watches for changes on GOOGLE's side — a deprecated endpoint, a reclassified scope, altered
# appDataFolder semantics — which the hermetic tests/unit_js/ suites structurally cannot see. Those
# pin our request shapes against an injected `fetchImpl` and catch every regression WE can cause.
#
# **Not part of the deploy gate, on purpose.** agent_tools/pipeline_gates.py requires every job in
# deploy.yml to gate the release, and this one deliberately lives outside that file instead of
# joining the chain: it depends on a third party's uptime, so gating a release on it would block a
# deploy for an outage no change of ours caused and no revert could fix. The failure it reports is
# real and worth waking up to — it just is not a reason to stop shipping. This file has exactly one
# job, so pipeline_gates' "exactly one terminal job" invariant holds here trivially.
#
# **No stored credential, by design.** Workload Identity Federation exchanges GitHub's OIDC assertion
# for a short-lived Google access token, so this repository holds no long-lived Google secret for an
# attacker to exfiltrate or for anyone to rotate. The provider's attribute condition in GCP MUST pin
# `assertion.repository` (see TODO §1.5) — without it, any repository on GitHub could mint tokens as
# this service account. Note also what is NOT here: no `pull_request_target` trigger, which is the
# standard way workflows leak credentials to untrusted fork code.

on:
  schedule:
    # 05:17 UTC daily. Off the hour on purpose — GitHub's scheduler queues heavily at :00 and
    # delays runs that pile up there.
    - cron: '17 5 * * *'
  workflow_dispatch:

# Read-only against the repo; the OIDC token is the only thing this workflow can actually do
# anything with. Scoped here rather than inherited so the grant is visible next to its one use.
permissions:
  contents: read
  id-token: write

jobs:
  live-google-canary:
    # NOT named "Stage N · …" — that prefix is how pipeline_gates.py binds a job to a local pipeline
    # stage and enforces stage ordering. This job belongs to no stage.
    name: Live · Google Drive & Calendar Contract
    runs-on: ubuntu-latest
    # Forks do not run scheduled workflows, but they can run workflow_dispatch — and a fork has no
    # WIF grant, so the run would fail confusingly rather than skip. Say so explicitly.
    if: github.repository == 'stutek/LibrePT'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      # Repository *variables*, not secrets: a WIF provider path and a service account email are
      # both non-sensitive identifiers (the security boundary is the provider's attribute condition
      # in GCP, not the secrecy of these strings). Keeping them as vars means a missing setup is a
      # readable skip below rather than an empty-secret authentication error.
      # Step 1 of 2: prove WHO this run is, without a stored credential. GitHub mints a short-lived
      # OIDC assertion ("this run is stutek/LibrePT on main"), Google verifies GitHub's signature and
      # returns an hour-long token. Nothing is stored on either side, so there is no key to rotate
      # and nothing an exfiltrating job could steal that outlives the run.
      - name: Authenticate to Google (Workload Identity Federation)
        id: auth
        if: vars.GOOGLE_WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WIF_PROVIDER }}
          service_account: ${{ vars.GOOGLE_TEST_SERVICE_ACCOUNT }}
          token_format: 'access_token'
          # cloud-platform is the ONLY scope Secret Manager accepts — it publishes no narrower one.
          # The real boundary is therefore IAM, not this scope: the service account holds
          # `secretmanager.secretAccessor` on ONE secret and no project roles at all, so a leaked
          # token of this kind reads that one secret and reaches nothing else.
          #
          # Note what is deliberately ABSENT: no drive.appdata, no calendar.freebusy. The federated
          # identity never holds app scopes. Drive and Calendar access comes only from the consumer
          # account's own grant below, which is the thing actually under test.
          access_token_scopes: 'https://www.googleapis.com/auth/cloud-platform'

      # Step 2 of 2: fetch the consumer test account's refresh token from Secret Manager and drop it
      # exactly where a developer's own credential lives. That is the point of writing a file rather
      # than exporting env vars: tests/live/_credentials.mjs then runs the SAME path in CI as on a
      # laptop, so the CI path cannot rot separately, and no secret is ever placed in the process
      # environment. `.private/` is gitignored, and the runner is destroyed after the job.
      - name: Fetch the test credential from Secret Manager
        if: steps.auth.outputs.access_token != ''
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          SECRET_RESOURCE: ${{ vars.GOOGLE_LIVE_SECRET }}
        run: |
          # pipefail matters here: without it a failed curl still yields a zero exit through the
          # pipe, and the job would carry on with an empty credential file and "skip" the suite —
          # a silently disarmed canary, which AGENT_RULES §2.A.3 treats as a failure, not a pass.
          set -euo pipefail
          mkdir -p .private
          curl -sS --fail \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "https://secretmanager.googleapis.com/v1/${SECRET_RESOURCE}/versions/latest:access" \
            | jq -r '.payload.data' | base64 -d > .private/google-live.json
          # A secret fetched at RUNTIME is not masked automatically — only ones GitHub injected are.
          echo "::add-mask::$(jq -r '.refresh_token' .private/google-live.json)"
          echo "::add-mask::$(jq -r '.client_secret' .private/google-live.json)"

      - name: Report missing federation setup
        if: vars.GOOGLE_WIF_PROVIDER == ''
        run: |
          echo "::warning::GOOGLE_WIF_PROVIDER is not set — the live suite will skip." \
               "See .private/google-cloud-setup.md for the one-time GCP setup."

      - name: Run Live Google API Tests
        # No credential env var by design — the suite reads .private/google-live.json, written above
        # when federation is configured and simply absent otherwise, which _credentials.mjs treats as
        # a skip rather than a failure.
        run: .venv/bin/python -c "from build import run_live_google_tests; run_live_google_tests()"
