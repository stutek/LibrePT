name: Live Google API Canary

# Watches for changes on GOOGLE's side — a deprecated endpoint, a reclassified scope, altered
# appDataFolder semantics — which the hermetic tests/unit_js/ suites structurally cannot see. Those
# pin our request shapes against an injected `fetchImpl` and catch every regression WE can cause.
#
# **Not part of the deploy gate, on purpose.** agent_tools/pipeline_gates.py requires every job in
# deploy.yml to gate the release, and this one deliberately lives outside that file instead of
# joining the chain: it depends on a third party's uptime, so gating a release on it would block a
# deploy for an outage no change of ours caused and no revert could fix. The failure it reports is
# real and worth waking up to — it just is not a reason to stop shipping. This file has exactly one
# job, so pipeline_gates' "exactly one terminal job" invariant holds here trivially.
#
# **Why a stored credential, after two attempts at avoiding one.** Workload Identity Federation was
# built here and removed on 2026-08-12, because the only identity it can produce is a SERVICE
# ACCOUNT, and Google removed service-account Drive storage quota: `files.list` against
# `appDataFolder` answers, the multipart upload returns 403, and their published remedies reach
# neither case (an `appDataFolder` cannot live in a shared drive; domain-wide delegation needs
# Workspace, not a consumer Gmail). A service account can read the Drive API and can never write to
# it, which would leave multipart upload — the one hand-rolled wire format in driveAppData.js —
# permanently unwatched. Only a real Google account can write, only the consent flow produces one,
# and a refresh token is the sole artifact that survives that consent without a browser.
#
# **So the trade is explicit rather than hidden**: one long-lived credential exists, in this
# repository's Actions secrets, and the OAuth app's *Testing* publishing status expires it every 7
# days (see the runbook — publishing to In production ends that). Everything else about the design
# is aimed at bounding it: the grant is `drive.appdata` (one hidden folder, one probe file) plus
# `calendar.freebusy` (busy intervals, never an event body), it is never echoed into a log, and
# there is no `pull_request_target` trigger — the standard way a public repository hands its
# secrets to untrusted fork code.

on:
  schedule:
    # 05:17 UTC daily. Off the hour on purpose — GitHub's scheduler queues heavily at :00 and
    # delays runs that pile up there.
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      access_token:
        description: 'Optional short-lived Google access token (see runbook B7) — overrides the stored credential for this run only. Never paste a refresh token here.'
        required: false
        type: string

# No `id-token: write`: nothing here mints anything any more, so the token that used to make this
# workflow interesting to an attacker is simply gone. Read-only against the repo.
permissions:
  contents: read

jobs:
  live-google-canary:
    # NOT named "Stage N · …" — that prefix is how pipeline_gates.py binds a job to a local pipeline
    # stage and enforces stage ordering. This job belongs to no stage.
    name: Live · Google Drive & Calendar Contract
    runs-on: ubuntu-latest
    # Forks do not run scheduled workflows, but they can run workflow_dispatch — and a fork holds no
    # copy of this repository's secrets, so the run would fail confusingly rather than skip.
    if: github.repository == 'stutek/LibrePT'
    steps:
      # FIRST step, before even the checkout: with no credential this job can only skip, and
      # discovering that after a checkout, a Python setup and a pip install is ~40s of wasted runner
      # time and a run page you have to read three screens into. It fails in seconds instead.
      #
      # A hard failure rather than the warning-and-skip this used to do. The old behaviour was
      # right when the repository might legitimately have no credential; it no longer can — the job
      # is already fenced to `stutek/LibrePT` so no fork reaches here, and on this repository a
      # missing credential means the secret was deleted or the refresh token expired. Both are
      # exactly the states a canary exists to shout about, and a green run that tested nothing is
      # what AGENT_RULES §2.A.3 calls a failure, not a pass.
      - name: Require a Google credential
        env:
          GOOGLE_LIVE_CREDENTIALS: ${{ secrets.GOOGLE_LIVE_CREDENTIALS }}
          DISPATCH_TOKEN: ${{ inputs.access_token }}
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_LIVE_CREDENTIALS}" ] || [ -n "${DISPATCH_TOKEN}" ]; then
            exit 0
          fi
          # The annotation is the one-line summary GitHub pins to the top of the run; the block
          # below is what someone actually follows. Both, because the annotation cannot hold steps.
          echo "::error title=No Google credential — the live canary cannot run::Set the GOOGLE_LIVE_CREDENTIALS secret (see docs/GOOGLE_CLOUD_SETUP.md Part B, or TODO.md section 1.5.1)."
          cat <<'INSTRUCTIONS'

          ────────────────────────────────────────────────────────────────────────
          The live Google canary has no credential, so it would test nothing.

          This is expected exactly once — before the one-time setup — and after
          that it means the secret was deleted, or the refresh token expired.

          TO FIX, follow Part B of docs/GOOGLE_CLOUD_SETUP.md (the account
          identities it refers to by role are in the maintainer's private notes):

            B0  Publish the OAuth consent screen.  Skipping this is what makes
                refresh tokens expire every 7 days, which is the most likely
                reason you are reading this on a repo that was already working.
            B1  Create a Desktop OAuth client.
            B2  Mint the credential — one command, which consents in a browser,
                exchanges the code and checks the granted scopes:
                  .venv/bin/python -m agent_tools.google_credential
            B3  Prove it locally:
                  .venv/bin/python -c "from build import run_live_google_tests; run_live_google_tests()"
            B4  gh secret set GOOGLE_LIVE_CREDENTIALS < .private/google-live.json

          To test a PR branch without touching the stored secret, dispatch this
          workflow with a short-lived access_token input instead (Part B, B7).
          ────────────────────────────────────────────────────────────────────────

          INSTRUCTIONS
          exit 1

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      # Written to the SAME path a developer's own credential lives at, rather than exported as an
      # environment variable, so tests/live/_credentials.mjs runs one code path in CI and on a
      # laptop — there is no CI-only branch to rot unnoticed. `.private/` is gitignored and the
      # runner is destroyed when the job ends.
      # The "neither is set" case cannot reach here — the first step fails the job on it. What
      # remains is a dispatch run supplying its own token and no stored secret, which needs no file.
      # A step's own `env:` is not visible to that step's `if:`, so the test is in the shell.
      - name: Install the stored credential
        env:
          GOOGLE_LIVE_CREDENTIALS: ${{ secrets.GOOGLE_LIVE_CREDENTIALS }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_LIVE_CREDENTIALS}" ]; then
            echo "Using the dispatch-supplied access token; no stored credential to install."
            exit 0
          fi
          mkdir -p .private
          # printf, not echo, and quoted: the payload is JSON and must reach the file byte-for-byte.
          printf '%s' "${GOOGLE_LIVE_CREDENTIALS}" > .private/google-live.json
          # GitHub masks a secret's own value automatically, but not values DERIVED from it — the
          # two fields below are what a later `set -x` or an error dump would otherwise print.
          echo "::add-mask::$(python -c "import json;print(json.load(open('.private/google-live.json'))['refresh_token'])")"
          echo "::add-mask::$(python -c "import json;print(json.load(open('.private/google-live.json'))['client_secret'])")"

      # Google revokes a refresh token that has gone six months UNUSED, and the daily run below
      # resets that clock — so the expiry never arrives while the canary works, and starts advancing
      # only once it silently stops (GitHub disables scheduled workflows after 60 days of repository
      # inactivity). There is nothing to observe until it is already dead, so this is a rotation
      # deadline measured from the mint stamp instead: red for a month before Google's boundary,
      # starting the moment the canary next runs.
      - name: Check the credential's rotation deadline
        run: .venv/bin/python -m agent_tools.credential_expiry

      - name: Run Live Google API Tests
        env:
          # A dispatch input, when given, short-circuits everything in _credentials.mjs — that is
          # what makes a one-off run against a PR branch possible without touching the stored
          # secret. Empty on a scheduled run, where the credential file above is the source.
          GOOGLE_LIVE_ACCESS_TOKEN: ${{ inputs.access_token }}
        run: .venv/bin/python -c "from build import run_live_google_tests; run_live_google_tests()"
