name: Build, Verify and Deploy to GitHub Pages

# NO custom run-name, deliberately. `head_commit.message` is the WHOLE message — subject AND body —
# and GitHub Actions expressions have no way to split a string (no split/regex; only contains,
# format, join, toJSON and friends). Using it therefore flattened every commit body into the run
# title, producing a paragraph where a title belongs. GitHub's own default titles a push run with
# the head commit's subject line, which is exactly what was wanted — so the fix is to stop
# overriding it, and to keep subjects short enough to read (AGENT_RULES §2.A.7).

# Publishes ONLY the runtime app (a freshly assembled dist/) to GitHub Pages on every
# push to main. Publishes only src/, so tests/, use_cases/, build/, deploy/, and the Markdown docs
# stay out of the public demo, and avoids committing a dist/ folder or a gh-pages branch.
#
# One-time setup in the repo: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". After that this workflow is the deploy path.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the official Pages deploy actions require
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once; a newer push supersedes an in-flight one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  python-lint:
    name: Python Lint & Format (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
      - name: Run Ruff
        run: .venv/bin/python -c "from build import run_python_lint; run_python_lint()"

  frontend-lint:
    name: Frontend Lint & Format (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
      - name: Run Biome
        run: .venv/bin/python -c "from build import run_frontend_lint; run_frontend_lint()"

  dependency-scan:
    name: Dependency Security Scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
      - name: Run pip-audit
        run: .venv/bin/python -c "from build import run_security_audit; run_security_audit()"

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
      - name: Run Unit Tests
        run: .venv/bin/python -c "from build import run_unit_tests; run_unit_tests()"

  e2e-tests:
    name: E2E Browser Tests
    needs: [python-lint, frontend-lint, dependency-scan, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Dependencies & Browsers
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/playwright install chromium --with-deps
      - name: Run E2E Tests
        run: .venv/bin/python -c "from build import run_e2e_tests; run_e2e_tests()"

  # One job, three named checks (build/frontend_audit.py + build.run_static_security_checks). NOT
  # three jobs: each GitHub Actions job costs a fresh runner, checkout and Python setup — ~30s of
  # overhead apiece for checks that take milliseconds. They are separated where separation is free
  # (named results in the output) and kept together where splitting would only buy latency.
  static-security-audits:
    name: Static Security Audits (CSP parity & HTML sinks)
    needs: [python-lint, frontend-lint, dependency-scan, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Static Security Audits
        run: python -c "from build import run_static_security_checks; run_static_security_checks()"

  owasp-zap-scan:
    name: OWASP ZAP Security Scan
    needs: [python-lint, frontend-lint, dependency-scan, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run OWASP ZAP Scan
        run: python -c "from build import run_owasp_zap_scan; run_owasp_zap_scan()"

  build:
    name: Assemble & Bundle App
    needs: [e2e-tests, static-security-audits, owasp-zap-scan]
    runs-on: ubuntu-latest
    steps:
      # fetch-tags: the release identity (TODO §16) is the git tag this commit carries, and the
      # default shallow checkout fetches no tags — without this every build would stamp itself "dev".
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0

      # The runtime app lives under src/. Publish that whole tree (index.html + app.js +
      # index.css + manifest.json + sw.js + i18n/ + components/ + icons/) flattened to the dist
      # root, so relative paths resolve the same as in local dev. This mirrors build/run_build()
      # (build/__init__.py) — keep the two in sync.
      # One entry point (build/releases.py, stdlib only — no venv needed) assembles the whole
      # published site so the root copy and the versioned copies cannot drift apart:
      #   • the current build at /<repo>/ — the stable path a PT's bookmark keeps pointing at;
      #   • every supported tag re-materialised from its own commit at /<repo>/<tag>/, because a
      #     Pages run publishes ONE artifact and a folder left out of it disappears (TODO §16.2);
      #   • versions.json, written only once tags exist, so the app never advertises a version it
      #     does not host.
      # Each copy gets its own <base>, version stamp, SPA 404 fallback and — last, over the exact
      # bytes served — its SHA-256 integrity catalog.
      - name: Assemble dist
        run: |
          base="/${GITHUB_REPOSITORY##*/}/"
          python3 -c "from build.releases import publish_site; publish_site('dist', '${base}')"
          touch dist/.nojekyll   # disable Jekyll processing on the published site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
