name: Build, Verify and Deploy to GitHub Pages

# NO custom run-name, deliberately. `head_commit.message` is the WHOLE message — subject AND body —
# and GitHub Actions expressions have no way to split a string (no split/regex; only contains,
# format, join, toJSON and friends). Using it therefore flattened every commit body into the run
# title, producing a paragraph where a title belongs. GitHub's own default titles a push run with
# the head commit's subject line, which is exactly what was wanted — so the fix is to stop
# overriding it, and to keep subjects short enough to read (AGENT_RULES §2.A.7).

# Publishes ONLY the runtime app (a freshly assembled dist/) to GitHub Pages on every
# push to main. Publishes only src/, so tests/, use_cases/, build/, deploy/, and the Markdown docs
# stay out of the public demo, and avoids committing a dist/ folder or a gh-pages branch.
#
# One-time setup in the repo: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". After that this workflow is the deploy path.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the official Pages deploy actions require
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once; a newer push supersedes an in-flight one
concurrency:
  group: pages
  cancel-in-progress: true

# This workflow is the same four-stage gate `python -m build check` runs locally, in the same order:
# Stage 1 (fast checks, concurrent) → Stage 2 medium → Stage 3 e2e → Stage 4 ZAP, then the post-gate
# assemble and deploy. The order is declared ONCE, in build/__init__.py's PIPELINE_STAGES;
# agent_tools/pipeline_gates.py reads that table and fails Stage 1 if this file drifts from it
# (TODO §6.4).
#
# EVERY job states its stage in its `name:`, and that label is checked, not decorative — a job
# running Stage N's checks must say `Stage N`, and a job running none must not claim a stage. That
# is what keeps a job from sitting BETWEEN stages: `static-security-audits` had quietly acquired a
# `needs` on all of Stage 1, so it ran after the fast checks and before Stage 2, delaying everything
# behind it, and nothing in the file said so. A fractional stage is now unrepresentable — you cannot
# write `Stage 1.5`, and an unlabelled or wrongly-labelled job fails the gate by name.
#
# === STAGE 1 === fast checks, no browser. No `needs`, so they all start at once, exactly as the
# local Stage 1 runs its table in one parallel batch.
jobs:
  python-lint:
    name: Stage 1 · Python Lint & Format (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/python-env
      - name: Run Ruff
        run: .venv/bin/python -c "from build import run_python_lint; run_python_lint()"

  doc-graph:
    name: Stage 1 · Documentation Graph (doclinks)
    runs-on: ubuntu-latest
    steps:
      # Needs the full history only for `git ls-files`, which a shallow checkout still serves — but
      # the checker reads the working tree, so no fetch-depth tuning is required here.
      - uses: ./.github/actions/python-env
      - name: Check documentation cross-references
        run: .venv/bin/python -c "from build import run_doc_graph_check; run_doc_graph_check()"

  frontend-lint:
    name: Stage 1 · Frontend Lint & Format (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/python-env
      - name: Run Biome
        run: .venv/bin/python -c "from build import run_frontend_lint; run_frontend_lint()"

  dependency-scan:
    name: Stage 1 · Dependency Security Scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/python-env
      - name: Run pip-audit
        run: .venv/bin/python -c "from build import run_security_audit; run_security_audit()"

  unit-tests:
    name: Stage 1 · Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/python-env
      - name: Run Unit Tests
        run: .venv/bin/python -c "from build import run_unit_tests; run_unit_tests()"

  javascript-unit-tests:
    name: Stage 1 · JavaScript Unit Tests (node:test)
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/python-env
      - name: Run JavaScript Unit Tests
        # No actions/setup-node: build.ensure_node_binary() vendors Node the same way
        # ensure_biome_binary() vendors Biome, so this stays on the same Python-only toolchain
        # every other job uses.
        run: .venv/bin/python -c "from build import run_javascript_unit_tests; run_javascript_unit_tests()"

  # Its own job, not folded into javascript-unit-tests, so a security regression is named as one on
  # the run page rather than reported as a generic unit-test failure. Covers the client-side classes
  # no other gate can reach: the OWASP ZAP baseline scan is PASSIVE and only sees what crosses the
  # network, while spreadsheet formula injection in a generated CSV and prototype pollution from
  # attacker-controlled object keys never leave the browser. Browser-tier security tests (the
  # stored-XSS sink, IndexedDB injection) run inside medium-tests / e2e-tests, where their tier
  # puts them.
  security-tests:
    name: Stage 1 · Security Tests
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/python-env
      - name: Run Security Tests
        run: .venv/bin/python -c "from build import run_security_tests; run_security_tests()"

  # One job, five named checks — same reasoning as static-security-audits below: each Actions job
  # costs a fresh runner, checkout and Python setup (~30s) for checks that take milliseconds. These
  # are the repo's structural invariants: the module catalog matches the tree, imports flow one way,
  # every CI job gates the deploy, and no function has grown past the complexity ceiling.
  structure-checks:
    name: Stage 1 · Structural Invariants (catalog, icons, layering, gating, complexity, test assertions)
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/python-env
      - name: Module catalog coverage
        run: .venv/bin/python -c "from build import run_catalog_coverage_check; run_catalog_coverage_check()"
      - name: Module self-path headers
        run: .venv/bin/python -c "from build import run_module_header_check; run_module_header_check()"
      - name: Icon coverage
        run: .venv/bin/python -c "from build import run_icon_coverage_check; run_icon_coverage_check()"
      - name: Import layering
        run: .venv/bin/python -c "from build import run_import_layer_check; run_import_layer_check()"
      - name: Python version declaration
        run: .venv/bin/python -c "from build import run_python_version_check; run_python_version_check()"
      - name: CI pipeline gating
        run: .venv/bin/python -c "from build import run_pipeline_gate_check; run_pipeline_gate_check()"
      - name: Cyclomatic complexity
        run: .venv/bin/python -c "from build import run_complexity_check; run_complexity_check()"
      - name: Test assertions pin behaviour
        run: .venv/bin/python -c "from build import run_test_assertion_check; run_test_assertion_check()"
      - name: Generated documentation pages
        run: .venv/bin/python -c "from build import run_docs_render_check; run_docs_render_check()"

  # One job, three named checks (build/frontend_audit.py + build.run_static_security_checks). NOT
  # three jobs: each GitHub Actions job costs a fresh runner, checkout and Python setup — ~30s of
  # overhead apiece for checks that take milliseconds. They are separated where separation is free
  # (named results in the output) and kept together where splitting would only buy latency.
  # Stage 1 locally, so Stage 1 here — no `needs`. It previously listed every other Stage 1 job,
  # which is what made it the de-facto half-stage the header comment describes.
  static-security-audits:
    name: Stage 1 · Static Security Audits (CSP parity & HTML sinks)
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/python-env
        with:
          install: 'false'
      - name: Run Static Security Audits
        run: python -c "from build import run_static_security_checks; run_static_security_checks()"

  # === STAGE 2 === needs ALL of Stage 1, so a broken component fails fast.
  #
  # Chaining is deliberately NOT the cheapest arrangement here: these jobs have no resource
  # contention in CI — each gets its own runner and its own dev server — so they *could* run
  # concurrently, and did. Chaining costs each stage's setup (checkout, pip install, `playwright
  # install chromium --with-deps`) in series on every green run. What it buys is that "the pipeline"
  # means one thing in both places, rather than two orderings nobody can keep straight.
  medium-tests:
    name: Stage 2 · Medium Component Tests
    needs:
      [
        python-lint,
        doc-graph,
        frontend-lint,
        dependency-scan,
        unit-tests,
        javascript-unit-tests,
        security-tests,
        structure-checks,
        static-security-audits,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/python-env
        with:
          browsers: 'true'
      - name: Run Medium Component Tests
        run: .venv/bin/python -c "from build import run_medium_tests; run_medium_tests()"

  # === STAGE 3 === Only if Stage 2 is clean, so a broken component fails fast and cheap rather than
  # after the slowest suite in the pipeline has also run.
  e2e-tests:
    name: Stage 3 · E2E Browser Tests
    needs: [medium-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/python-env
        with:
          browsers: 'true'
      - name: Run E2E Tests
        run: .venv/bin/python -c "from build import run_e2e_tests; run_e2e_tests()"

  # === STAGE 4 === Only if Stage 3 is clean. Locally that ordering is mandatory: ZAP's request flood
  # against the SAME dev server a mid-suite pytest-xdist run is using produced Page.goto timeouts
  # across unrelated specs. Here it is not mandatory — separate runners, separate servers — but it is
  # kept so the stage numbering means one thing in both places.
  owasp-zap-scan:
    name: Stage 4 · OWASP ZAP Security Scan
    needs: [e2e-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/python-env
        with:
          install: 'false'
      - name: Run OWASP ZAP Scan
        run: python -c "from build import run_owasp_zap_scan; run_owasp_zap_scan()"

  build:
    name: Post-gate · Assemble & Bundle App
    # The chain carries the rest transitively: zap → e2e → medium → every Stage 1 job.
    needs: [owasp-zap-scan]
    runs-on: ubuntu-latest
    steps:
      # Through the same entry point as every other job, with no venv: this step bundles with system
      # `python3`, and before 2026-08-18 that was whatever the runner image happened to carry — the very
      # divergence the single declaration exists to remove, one job further along.
      - uses: ./.github/actions/python-env
        with:
          install: 'false'

      # The runtime app lives under src/. Publish that whole tree (index.html + app.js +
      # index.css + manifest.json + sw.js + i18n/ + components/ + icons/) flattened to the dist
      # root, so relative paths resolve the same as in local dev. build/run_build() is the single
      # entry point local builds use too (build/__init__.py) — keep the two in sync.
      #
      # No release tags, no per-version folders, no versions.json: multi-version hosting was
      # dropped (TODO §16/§18) — one build carries every supported data schema concurrently, and
      # storage keys on the schema major, not a release tag. Just the current build, at /<repo>/,
      # with its <base> rewritten for the Pages sub-path, a SPA 404 fallback, and — last, over the
      # exact bytes served — its SHA-256 integrity catalog.
      - name: Assemble dist
        run: |
          base="/${GITHUB_REPOSITORY##*/}/"
          python3 -c "from build import run_build; run_build(base='${base}')"
          touch dist/.nojekyll   # disable Jekyll processing on the published site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
