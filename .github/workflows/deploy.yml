name: Build, Verify and Deploy to GitHub Pages

# Title each run with the head commit's message (its first line shows in the runs list) instead of
# GitHub's default — which falls back to the workflow name / "Commit <sha> pushed by <user>" for a
# multi-commit push. workflow_dispatch has no head_commit, so fall back to the workflow name there.
run-name: ${{ github.event.head_commit.message || github.workflow }}

# Publishes ONLY the runtime app (a freshly assembled dist/) to GitHub Pages on every
# push to main. Publishes only src/, so tests/, use_cases/, build/, deploy/, and the Markdown docs
# stay out of the public demo, and avoids committing a dist/ folder or a gh-pages branch.
#
# One-time setup in the repo: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". After that this workflow is the deploy path.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the official Pages deploy actions require
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once; a newer push supersedes an in-flight one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  python-lint:
    name: Python Lint & Format (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
      - name: Run Ruff
        run: .venv/bin/python -c "from build import run_python_lint; run_python_lint()"

  frontend-lint:
    name: Frontend Lint & Format (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
      - name: Run Biome
        run: .venv/bin/python -c "from build import run_frontend_lint; run_frontend_lint()"

  dependency-scan:
    name: Dependency Security Scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
      - name: Run pip-audit
        run: .venv/bin/python -c "from build import run_security_audit; run_security_audit()"

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
      - name: Run Unit Tests
        run: .venv/bin/python -c "from build import run_unit_tests; run_unit_tests()"

  e2e-tests:
    name: E2E Browser Tests
    needs: [python-lint, frontend-lint, dependency-scan, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Dependencies & Browsers
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/playwright install chromium --with-deps
      - name: Run E2E Tests
        run: .venv/bin/python -c "from build import run_e2e_tests; run_e2e_tests()"

  dynamic-security-checks:
    name: Dynamic Security & Injection Checks
    needs: [python-lint, frontend-lint, dependency-scan, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Dynamic Security Checks
        run: python -c "from build import run_dynamic_security_checks; run_dynamic_security_checks()"

  owasp-zap-scan:
    name: OWASP ZAP Security Scan
    needs: [python-lint, frontend-lint, dependency-scan, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run OWASP ZAP Scan
        run: python -c "from build import run_owasp_zap_scan; run_owasp_zap_scan()"

  build:
    name: Assemble & Bundle App
    needs: [e2e-tests, dynamic-security-checks, owasp-zap-scan]
    runs-on: ubuntu-latest
    steps:
      # fetch-tags: the release identity (TODO §16) is the git tag this commit carries, and the
      # default shallow checkout fetches no tags — without this every build would stamp itself "dev".
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0

      # The runtime app lives under src/. Publish that whole tree (index.html + app.js +
      # index.css + manifest.json + sw.js + i18n/ + components/ + icons/) flattened to the dist
      # root, so relative paths resolve the same as in local dev. This mirrors build/run_build()
      # (build/__init__.py) — keep the two in sync.
      - name: Assemble dist
        run: |
          mkdir -p dist
          cp -r src/. dist/
          touch dist/.nojekyll   # disable Jekyll processing on the published site
          # Build stamp: overwrite version.js with the real short commit SHA + UTC build time, so the
          # header shows which build is live and a client screenshot pins a bug report to a commit.
          # `release` is the tag this commit IS (--exact-match, never the nearest one: a commit past
          # v1.2.0 is not v1.2.0, and must not write into that version's storage bucket). Untagged
          # commits stamp "dev" and opt out of version switching. Mirrors build.stamp_build_version.
          commit="${GITHUB_SHA::7}"
          builtAt="$(date -u +%Y-%m-%dT%H:%MZ)"
          release="$(git describe --tags --exact-match 2>/dev/null || echo dev)"
          printf 'export const BUILD_INFO = { commit: "%s", builtAt: "%s", release: "%s" };\n' "${commit}" "${builtAt}" "${release}" > dist/version.js
          echo "Stamped build ${commit} (${builtAt}) release ${release}"
          # GitHub Pages serves a project site under /<repo>/, but the source assumes the
          # domain root (<base href="/">) so it works when src/ is served at localhost:8081/.
          # Rewrite the base to the repo sub-path so index.css, manifest.json, icons and the
          # service worker resolve on Pages. app.js derives the same sub-path from its own URL.
          base="/${GITHUB_REPOSITORY##*/}/"
          sed -i "s#<base href=\"/\">#<base href=\"${base}\">#" dist/index.html
          echo "Rewrote <base> to ${base}"
          # SPA deep-link fallback: GitHub Pages serves 404.html for any path with no file.
          # Shipping the app shell as 404.html lets a direct visit to a clean route
          # (e.g. /LibrePT/sessions/2026-07-17) boot the app, which then resolves the route
          # client-side — or shows the in-app not-found view for an unknown one.
          cp dist/index.html dist/404.html
          # Download-integrity + version-coherence catalog: a SHA-256 of every shipped file, which the
          # service worker verifies on precache (see sw.js) so a corrupted or version-skewed asset can
          # never be cached. Must run LAST — after the version stamp, the <base> rewrite AND the
          # 404.html copy — so the hashes match the exact bytes served. Stdlib only, so no venv needed.
          python3 -c "from build import generate_integrity_catalog; generate_integrity_catalog('dist')"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
