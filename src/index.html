<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LibrePT - Personal Trainer Dashboard</title>
  
  <!-- Security Meta Tags -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self' https://cdnjs.cloudflare.com; base-uri 'self'; form-action 'self'; object-src 'none';">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
  <meta name="description" content="LibrePT is a mobile-friendly group & individual exercise tracking web app for personal trainers with instant client switching, scroll-free logging, and async feedback loops.">
  <meta name="theme-color" content="#f6f7fb">
  
  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  
  <!-- Vendored webfonts (offline-first): DM Sans / Outfit / JetBrains Mono, served locally so there
       is no fonts.googleapis.com / fonts.gstatic.com dependency and a signal-less first load renders
       in-brand. Regenerate via scratchpad/vendor_fonts.py. -->
  <link rel="stylesheet" href="fonts/fonts.css">
  
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Inline SVG favicon: the Font Awesome dumbbell path in --primary emerald, matching the header logo mark -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%20-64%20640%20640'%3E%3Cpath%20fill='%2310b981'%20d='M96%2064c0-17.7%2014.3-32%2032-32h32c17.7%200%2032%2014.3%2032%2032V224v64V448c0%2017.7-14.3%2032-32%2032H128c-17.7%200-32-14.3-32-32V384H64c-17.7%200-32-14.3-32-32V288c-17.7%200-32-14.3-32-32s14.3-32%2032-32V160c0-17.7%2014.3-32%2032-32H96V64zm448%200v64h32c17.7%200%2032%2014.3%2032%2032v64c17.7%200%2032%2014.3%2032%2032s-14.3%2032-32%2032v64c0%2017.7-14.3%2032-32%2032H544v64c0%2017.7-14.3%2032-32%2032H480c-17.7%200-32-14.3-32-32V288%20224%2064c0-17.7%2014.3-32%2032-32h32c17.7%200%2032%2014.3%2032%2032zM416%20224v64H224V224H416z'/%3E%3C/svg%3E">

  <!-- Custom Styles: index.css carries shared design tokens, glass-card/button/flex foundations
       and color scheme, loaded first. Per-module stylesheets below add only what that module owns
       (TODO §14.5 / §18.10 — a monolithic stylesheet cannot be shared/toggled per behaviour).
       Multiple requests, no build-time concatenation, by deliberate choice: this mirrors how the
       app already treats JS (~89 native ES module requests, not bundled, TODO §12.7) rather than
       introduce this project's first source-to-shipped-bytes transformation — dist/ stays a
       verbatim copy of src/ (TODO §16). -->
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="modules/clipboard/activeSessionOverlay.css">
  <link rel="stylesheet" href="modules/clipboard/clipboardEditor.css">
  <link rel="stylesheet" href="modules/clipboard/exerciseDeck.css">
  <link rel="stylesheet" href="modules/clipboard/exerciseCard.css">
  <link rel="stylesheet" href="modules/clipboard/circuitCard.css">
  <link rel="stylesheet" href="modules/clipboard/exerciseAndRestTimer.css">
  <link rel="stylesheet" href="modules/common/activeUsersList.css">
  <link rel="stylesheet" href="modules/common/applicationHeader.css">
  <link rel="stylesheet" href="modules/common/notificationArea.css">
  <link rel="stylesheet" href="modules/common/backupRestore.css">
  <link rel="stylesheet" href="modules/common/buildInfoDialog.css">
  <link rel="stylesheet" href="modules/common/feedbackModal.css">
  <link rel="stylesheet" href="modules/clients/clientsView.css">
  <link rel="stylesheet" href="modules/plans/plansView.css">
  <link rel="stylesheet" href="modules/exercises/exercisesView.css">
  <link rel="stylesheet" href="modules/exercises/exercisePicker.css">
  <link rel="stylesheet" href="modules/history/historyView.css">
  <link rel="stylesheet" href="modules/session/editSessionView.css">
  <link rel="stylesheet" href="modules/sessionList/sessionsView.css">

  <!-- Module Preloading for Core Architecture & Views -->
  <link rel="modulepreload" href="app.js">
  <link rel="modulepreload" href="modules/common/utils.js">
  <link rel="modulepreload" href="modules/common/dom.js">
  <link rel="modulepreload" href="i18n/index.js">
  <link rel="modulepreload" href="i18n/domMappings.js">
  <link rel="modulepreload" href="data/index.js">
  <link rel="modulepreload" href="controllers/gestureController.js">
  <link rel="modulepreload" href="controllers/clientFormsController.js">
  <link rel="modulepreload" href="controllers/routineFormsController.js">
  <link rel="modulepreload" href="controllers/exerciseFormsController.js">
  <link rel="modulepreload" href="controllers/activeSessionController.js">
  <link rel="modulepreload" href="modules/sessionList/sessionsView.js">
  <link rel="modulepreload" href="modules/clients/clientsView.js">
  <link rel="modulepreload" href="modules/plans/plansView.js">
  <link rel="modulepreload" href="modules/exercises/exercisesView.js">
  <!-- Classic (render-blocking) theme bootstrap — external so CSP script-src can drop 'unsafe-inline'. -->
  <script src="theme-boot.js"></script>
</head>
<body class="daylight-theme">

  <!-- Integrity error page: a blocking overlay shown only when the service worker fails to verify a
       build against its SHA-256 catalog (corrupt download / version skew) or finds no catalog at all.
       Hidden by default; revealed by appLifecycleController on an INTEGRITY_ERROR message from sw.js. -->
  <div id="integrity-error-overlay" class="integrity-error-overlay hidden" role="alertdialog" aria-modal="true" aria-labelledby="integrity-error-title" aria-describedby="integrity-error-message">
    <div class="integrity-error-card">
      <i class="fa-solid fa-shield-halved integrity-error-icon" aria-hidden="true"></i>
      <h2 id="integrity-error-title">App verification failed</h2>
      <p id="integrity-error-message">This build could not be verified.</p>
      <p id="integrity-error-detail" class="integrity-error-detail"></p>
      <button id="btn-integrity-retry" class="btn primary-btn" type="button">Clear cache &amp; retry</button>
    </div>
  </div>

  <!-- Top Header Bar — inner markup owned and injected by applicationHeader.js
       (renderHeaderShell), which already owns all of the header's behavior. -->
  <header id="app-header" class="app-header"></header>

  <!-- Main View Container -->
  <main id="main-content">
  </main>

  <!-- Omnipresent Notification Area (replaces old footer & bottom-nav) — inner markup owned
       and injected by notificationArea.js (renderNotificationAreaShell). -->
  <aside id="notification-area" class="notification-area" aria-label="Notification Center and Active Session"></aside>

  <!-- FULL SCREEN OVERLAY: Active Workout Clipboard Dashboard — inner markup owned and
       injected by activeSessionOverlayView.js (renderActiveSessionOverlayShell), called from
       activeSessionController.js's setupActiveSession(). -->
  <div id="active-session-overlay" class="active-session-overlay hidden"></div>

  <!-- Per-client timer stack: one labelled countdown per client (client name + Rest/Exercise),
       stacked on the clipboard. Counts into negative overtime; dismiss-only (✕). Populated and
       persisted by components/exerciseAndRestTimer.js; a global fixed overlay shown on every view
       whenever any client has an active timer, not just while the live session overlay is open. -->
  <div id="clipboard-timer-stack" class="timer-stack hidden"></div>

  <!-- Every <dialog> is injected here by its owning module (clientFormsController.js,
       routineFormsController.js, exerciseFormsController.js, activeSessionController.js,
       feedbackModal.js, planAdjustments.js, backupRestore.js, applicationHeader.js,
       buildInfoDialog.js) at boot, before that module wires its behavior — index.html only owns
       the mount point, not any dialog's markup. -->
  <div id="dialogs-root"></div>
  <!-- Application Logic Scripts -->
  <script type="module" src="app.js"></script>
</body>
</html>
